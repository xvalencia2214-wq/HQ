# A FREE practice copy of Bella's Música on Render: the test drive (practice accounts, a party in progress, every feature)
# that you can open from an iPad or phone. Money and texts are pretend. It always asks for PREVIEW_PASSWORD.
# Render's free plan sleeps after 15 minutes without visits; the next visit wakes it in about a minute, with fresh practice data.
# On render.com: New > Blueprint > pick this repository and branch > Blueprint path: render-tryout.yaml > Apply.
# Step by step in plain words: bellas-musica/docs/test-drive.md ("No computer? A practice copy online")
services:
  - type: web
    name: bellas-musica-test-drive
    runtime: docker
    dockerfilePath: ./bellas-musica/Dockerfile
    dockerContext: ./bellas-musica
    region: ohio
    plan: free
    dockerCommand: ./start.sh                    # the image's normal start (replaces an older setting)
    healthCheckPath: /api/health
    buildFilter:
      paths: ["bellas-musica/**", "render-tryout.yaml"]
    envVars:
      - { key: PREVIEW_PASSWORD, sync: false }   # a password you choose: Safari asks for it (any name, this password)
      - { key: SESSION_SECRET, generateValue: true }
      - { key: TRYOUT, value: "1" }                # start the test drive instead of the real site
