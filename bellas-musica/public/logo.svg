<path d="M41.5 67 C46 66 48 69 52 68 C57 67 59 70 64 69.5 C69 69 71 66.5 76 67.5 C80 68.5 83 66 86.5 66.5" stroke-width="1.2"/>
<path d="M48 67.5 C47 65 48.5 63.5 50 63" stroke-width=".9"/>
<path d="M58 69 C57.5 71.5 59 73 61 73.4" stroke-width=".9"/>
<path d="M70 68.6 C71 71.2 69.5 72.8 67.5 73.2" stroke-width=".9"/>
