<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bella's Música logo: a navy charro sombrero seen from the side, with gold stitching on its rolled brim">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset=".5" stop-color="#d4a53c"/><stop offset="1" stop-color="#a87a1f"/></linearGradient>
<radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f1e3"/></radialGradient>
<linearGradient id="crown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4891"/><stop offset=".35" stop-color="#1a3170"/><stop offset="1" stop-color="#0b1838"/></linearGradient>
<linearGradient id="brimtop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c3270"/><stop offset=".5" stop-color="#132654"/><stop offset="1" stop-color="#22397c"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2f68"/><stop offset="1" stop-color="#081230"/></linearGradient>
</defs>
<rect width="128" height="128" rx="30" fill="url(#bg)"/>
<rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
<g transform="translate(64 67) scale(.92) translate(-65.5 -64)">
<!-- the brim from the side: a canoe that curls up a little at the front and sweeps up high at the back -->
<path d="M10 64 C22 70 38 72 52 72.5 C74 73 98 66 112 52 C116 48 119 44 121 39 C124 46 121 64 110 76 C96 90 74 96 56 96 C36 96 18 90 10 78 C7 74 7.5 67 10 64 Z" fill="url(#brimtop)"/>
