<path d="M64 72 C58 66 58 61 64 57 C70 53 70 48 64 44.5 C58 48 58 53 64 57 C70 61 70 66 64 72"/>
</g>
<circle cx="64" cy="43.2" r="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
<circle cx="64" cy="74.5" r="3.6" fill="url(#gold)" stroke="#7a5710" stroke-width=".7"/>
<circle cx="64" cy="74.5" r="1.3" fill="#7a5710"/>
<!-- the rolled edge along the front of the brim, stitched with gold loops -->
