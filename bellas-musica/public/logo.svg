<circle cx="52" cy="67.2" r="2.5"/><circle cx="64" cy="70" r="2.9"/><circle cx="76.5" cy="67" r="2.5"/><circle cx="44" cy="66.4" r="1.6"/><circle cx="85" cy="65.8" r="1.6"/>
