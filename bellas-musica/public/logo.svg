<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bella's Música logo: a navy charro sombrero with a gold-embroidered band">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset=".5" stop-color="#d4a53c"/><stop offset="1" stop-color="#a87a1f"/></linearGradient>
<radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f1e3"/></radialGradient>
<linearGradient id="crown" x1="0" y1="0" x2="1" y2=".25"><stop offset="0" stop-color="#2c4a94"/><stop offset=".45" stop-color="#1b336f"/><stop offset="1" stop-color="#0a1636"/></linearGradient>
<linearGradient id="brim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22397c"/><stop offset=".55" stop-color="#162b60"/><stop offset="1" stop-color="#0c1a40"/></linearGradient>
<linearGradient id="lip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a5aa8" stop-opacity="0"/><stop offset="1" stop-color="#4c6cba"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4e2"/><stop offset="1" stop-color="#ead9b2"/></linearGradient>
<g id="flower"><g fill="#14285e"><circle cx="0" cy="-2" r="1.5"/><circle cx="1.9" cy="-.6" r="1.5"/><circle cx="1.2" cy="1.6" r="1.5"/><circle cx="-1.2" cy="1.6" r="1.5"/><circle cx="-1.9" cy="-.6" r="1.5"/></g><circle r="1" fill="#e6c063"/></g>
</defs>
<rect width="128" height="128" rx="30" fill="url(#bg)"/>
<rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
<g transform="translate(64 66) scale(.88) translate(-65 -64)">
<!-- the brim: very wide, seen from a little above, curling up at the back on the right -->
<path d="M6 88 C7 78 34 69 64 67 C88 65.5 106 62 116 58 C122 56 125 60 124.5 66 C124 75 120 82 113 88 C100 98 72 104 42 102.5 C20 101 6 95.5 6 88 Z" fill="#081230"/>
<path d="M6 86 C7 76 34 67 64 65 C88 63.5 106 60 116 56 C122 54 125 58 124.5 64 C124 73 120 80 113 86 C100 96 72 102 42 100.5 C20 99 6 93.5 6 86 Z" fill="url(#brim)" stroke="url(#gold)" stroke-width="1.2"/>
<!-- the raised lip at the back right -->
<path d="M116 56 C122 54 125 58 124.5 64 C124 73 120 80 113 86 C109 89 105 91.5 101 93.5 C110 86 116 78 117.5 70 C118.5 64 118 59 116 56 Z" fill="url(#lip)" opacity=".85"/>
<path d="M9 88 C12 95 26 99 42 99.6 C70 101 100 95 112.5 85.5" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".7"/>
<!-- the crown: tall and smoothly rounded, leaning a little -->
<path d="M39 78 C37.5 62 39.5 44 46 33 C50 26 55 22.5 61 22.5 C67.5 22.5 73 27 76.5 34 C81.5 45 82.5 62 81 78 C72 83.5 48 83.5 39 78 Z" fill="url(#crown)"/>
<path d="M50 31 C46 39 44 50 43.6 60" fill="none" stroke="#5a78c4" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
<!-- the embroidered band: cream, with a wavy top edge -->
<path d="M39.2 65.5 C42.5 58.5 46 58.5 49.2 63.4 C52.2 68 56.2 68 59.4 61.4 C62.4 55.4 66.6 55.4 69.6 61.2 C72.6 66.6 76.8 66.4 80.8 60 L81 78 C72 83.5 48 83.5 39 78 Z" fill="url(#band)"/>
<!-- gold scrolls and navy flowers stitched across the band -->
<g fill="none" stroke="#b8862a" stroke-width=".9" stroke-linecap="round">
<path d="M41.5 74.5 C41.5 71 45.5 70.5 45.5 73.2 C45.5 75 43.3 75 43.5 73.5"/>
<path d="M51.5 76.6 C51 73.5 54.6 72.6 55 75.2 C55.2 76.8 53.2 77 53.3 75.6"/>
<path d="M66 76.6 C66.5 73.5 62.9 72.6 62.5 75.2 C62.3 76.8 64.3 77 64.2 75.6"/>
<path d="M76.5 73.6 C77 70.4 73.4 69.6 73 72.2 C72.8 73.8 74.8 74 74.7 72.6"/>
<path d="M44 68 C47 70.5 50 70 52 72.5 M58 74 C60 72 62 72 63.5 73.6 M68 72.5 C70 70 73 70.5 75 68.6"/>
</g>
<use href="#flower" transform="translate(48.5 69.5)"/>
<use href="#flower" transform="translate(59.6 70.2) scale(1.15)"/>
<use href="#flower" transform="translate(71 68.6)"/>
<!-- the braided cord: along the wavy top edge and the base of the band -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M39.2 65.5 C42.5 58.5 46 58.5 49.2 63.4 C52.2 68 56.2 68 59.4 61.4 C62.4 55.4 66.6 55.4 69.6 61.2 C72.6 66.6 76.8 66.4 80.8 60" stroke="url(#gold)" stroke-width="2.4"/>
<path d="M39.2 65.5 C42.5 58.5 46 58.5 49.2 63.4 C52.2 68 56.2 68 59.4 61.4 C62.4 55.4 66.6 55.4 69.6 61.2 C72.6 66.6 76.8 66.4 80.8 60" stroke="#7a5710" stroke-width="2.4" stroke-dasharray=".8 1.4" opacity=".55"/>
<path d="M39 78 C48 83.5 72 83.5 81 78" stroke="url(#gold)" stroke-width="2.4"/>
<path d="M39 78 C48 83.5 72 83.5 81 78" stroke="#7a5710" stroke-width="2.4" stroke-dasharray=".8 1.4" opacity=".55"/>
</g>
<!-- the knot on the side, with two tassels -->
<g transform="translate(81.5 69)">
<ellipse cx="0" cy="0" rx="3.4" ry="5.4" fill="url(#gold)" stroke="#8a6414" stroke-width=".6"/>
<path d="M-2.6 -3 L2.6 3 M2.6 -3 L-2.6 3 M-3 0 L3 0" stroke="#8a6414" stroke-width=".6"/>
<path d="M-.5 5 C0 8 -.5 10 0 12.5 M1 5 C2.5 8 3.5 10 4.5 12" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round"/>
<path d="M-1.6 12 L1.6 12 L1.1 16 L-1.1 16 Z" fill="url(#gold)"/><path d="M3 11.6 L6.2 11.8 L5.6 15.6 L3.4 15.4 Z" fill="url(#gold)"/>
<circle cx="0" cy="11.6" r="1.1" fill="#14285e"/><circle cx="4.6" cy="11.4" r="1.1" fill="#14285e"/>
</g>
</g>
</svg>
