<path d="M41 78 C40 64 40.5 50 42.2 42 C43.6 33 50 25.5 64 25.5 C78 25.5 84.4 33 85.8 42 C87.5 50 88 64 87 78 Z" fill="url(#crown)"/>
<path d="M45 40 C46.5 32.5 53 28.5 64 28.5 C75 28.5 81.5 32.5 83 40 C79 44.5 72 42 64 45 C56 42 49 44.5 45 40 Z" fill="#4a68b4" opacity=".5"/>
